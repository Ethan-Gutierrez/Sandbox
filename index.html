  <div style="text-align:center;" class="image">

  <div class = "chart-container">

  <script>
    const ctx=doc.getElementById("chart");
    new Chart(ctx,{
      type: "line",
      data: {
        labels:["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
        datasets:[{
          label:"Anime Episodes watched", 
          data:[3,1,2,0,0,2,3],

          bachgroundColor: "00FF00",
          borderWidth:3,
          fill:true,
          tension:0.35,
          pointRadius:4,
          pointBackgroundColor:"FF0000"
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:true,

        plugins:{
          legend:{display:true
                 }
        },
        scales:{
          y:{beginAtZero:true
            }
        }
      }
    });
  </script>
